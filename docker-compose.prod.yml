version: '3.9'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASS}" 
      MSSQL_PID: "Express"
    ports:
      - "1433:1433" # Port để SSMS kết nối vào
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-U", "sa", "-P", "${DB_PASS}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 1433
      DB_DIALECT: mssql
      DB_NAME: ${DB_NAME}
      DB_USER: sa
      DB_PASS: ${DB_PASS}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "80:3000"
    volumes:
      - uploads:/app/public/uploads/products

volumes:
  mssql_data:
  uploads: